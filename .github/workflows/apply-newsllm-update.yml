name: Apply verified NewsLLM update

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-test-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Apply prepared update
        run: |
          base64 --decode newsllm-code.patch.gz.b64 | gzip -d > /tmp/newsllm.patch
          git apply /tmp/newsllm.patch
          rm newsllm-code.patch.gz.b64
      - name: Format and validate
        run: |
          dart format lib
          flutter pub get
          flutter analyze
          flutter test
          flutter build web --release
          python -m json.tool firebase.json > /dev/null
          python -m json.tool web/manifest.json > /dev/null
          git diff --check
      - name: Commit verified update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finish Bangla UI and production web setup"
          git push origin main
