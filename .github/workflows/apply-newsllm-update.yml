name: Apply verified NewsLLM update

on:
  workflow_dispatch:
    inputs:
      patch_gzip_base64:
        description: Prepared compressed patch
        required: true
        type: string

permissions:
  contents: write

jobs:
  apply-test-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply prepared update
        env:
          PATCH_GZIP_BASE64: ${{ inputs.patch_gzip_base64 }}
        run: |
          printf '%s' "$PATCH_GZIP_BASE64" | base64 --decode | gzip -d > /tmp/newsllm.patch
          git apply /tmp/newsllm.patch

      - name: Format and validate
        run: |
          dart format lib
          flutter pub get
          flutter analyze
          flutter test
          flutter build web --release
          python -m json.tool firebase.json > /dev/null
          python -m json.tool web/manifest.json > /dev/null
          git diff --check

      - name: Commit verified update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finish Bangla UI and production web setup"
          git push origin main
