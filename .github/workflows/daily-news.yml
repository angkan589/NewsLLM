name: Daily NewsLLM Content

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish generated articles to Firestore
        required: true
        default: false
        type: boolean
  schedule:
    # 06:15 in Bangladesh (UTC+6). Scheduled publishing remains disabled
    # until the ENABLE_DAILY_PIPELINE repository variable is set to true.
    - cron: "15 0 * * *"

permissions:
  contents: read

concurrency:
  group: daily-newsllm-content
  cancel-in-progress: false

jobs:
  process-news:
    if: github.event_name == 'workflow_dispatch' || vars.ENABLE_DAILY_PIPELINE == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: tools/requirements.txt

      - name: Install pipeline dependencies
        run: python -m pip install -r tools/requirements.txt

      - name: Validate configured secrets
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT_B64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_B64 }}
        run: |
          test -n "$GEMINI_API_KEY" || {
            echo "Missing GitHub secret: GEMINI_API_KEY" >&2
            exit 1
          }
          test -n "$FIREBASE_SERVICE_ACCOUNT_B64" || {
            echo "Missing GitHub secret: FIREBASE_SERVICE_ACCOUNT_B64" >&2
            exit 1
          }

      - name: Prepare temporary Firebase credential
        env:
          FIREBASE_SERVICE_ACCOUNT_B64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_B64 }}
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT_B64" \
            | base64 --decode \
            > "$RUNNER_TEMP/firebase-service-account.json"
          python -m json.tool "$RUNNER_TEMP/firebase-service-account.json" \
            > /dev/null

      - name: Discover and process daily articles
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
          PYTHONUNBUFFERED: "1"
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_PUBLISH: ${{ inputs.publish }}
        run: |
          publish_args=()
          if [[ "$EVENT_NAME" == "schedule" || "$REQUESTED_PUBLISH" == "true" ]]; then
            publish_args=(--publish --yes)
          fi

          python tools/daily_news_pipeline.py \
            --max-articles 3 \
            --per-source 1 \
            "${publish_args[@]}"

      - name: Remove temporary credential
        if: always()
        run: rm -f "$RUNNER_TEMP/firebase-service-account.json"
